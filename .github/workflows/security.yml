name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"   

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          pip install --require-hashes -r app/requirements.txt
          pip install pytest bandit pip-audit
      - name: Tests (attaque + fonctionnels)
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest -q tests
      - name: Bandit
        run: bandit -r app -ll
      - name: pip-audit
        run: pip-audit -r app/requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
      - name: Scan des dépendances et de la config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build de l'image
        run: docker build -t minishop:ci app/
      - name: Scan de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: minishop:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 
        with:
          python-version: "3.12"
      - name: Générer le SBOM CycloneDX
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements app/requirements.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  
        with:
          name: sbom
          path: sbom.cdx.json
